name: demo_vehicle_management
description: A demo app for managing vehicles.
publish_to: 'none'

version: 1.0.0+35

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  dotted_border: ^2.1.0
  google_fonts: ^6.3.2
  data_table_2: ^2.5.15
  mobile_scanner: ^7.1.3
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.2
  timezone: ^0.10.1
  geolocator: ^13.0.2
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

# ==============================
# SPLASH SCREEN
# ==============================
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png

  android: true
  ios: false

  android_12:
    color: "#FFFFFF"
    image: assets/images/logo.png

# ==============================
# APP LAUNCHER ICON
# ==============================
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"